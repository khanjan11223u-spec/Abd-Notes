<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABD NOTES</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@400;500;600&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #000000; 
            background-image: radial-gradient(#222 1px, transparent 1px);
            background-size: 15px 15px;
            color: #fff; 
            font-family: 'Poppins', sans-serif;
            padding: 20px;
            padding-bottom: 100px;
        }

        /* --- Header Section (Centered) --- */
        .header { 
            display: flex; 
            justify-content: center; /* Center Heading */
            align-items: center; 
            margin-bottom: 25px; 
            position: relative;
        }
        .title-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .title-container i { 
            color: #FFD700; 
            font-size: 28px; 
            text-shadow: 0 0 20px #FFD700, 0 0 40px #FFD700; /* Strong Glow */
        }
        .title-container h1 { 
            font-family: 'Cinzel', serif;
            color: #FFD700; 
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.9), 0 0 30px rgba(255, 215, 0, 0.6); /* Golden Text Glow */
            font-size: 26px; 
            letter-spacing: 2px;
        }

        /* --- Top Buttons (Pills) --- */
        .top-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }
        .top-btn {
            background: #0a0a0a;
            border: 2px solid #FFD700;
            color: #FFD700;
            padding: 6px 18px;
            border-radius: 30px; /* Circular pill */
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 0 10px rgba(255,215,0,0.2), inset 0 0 10px rgba(255,215,0,0.1);
            transition: 0.3s;
        }
        .top-btn.active {
            background: #FFD700;
            color: #000;
            box-shadow: 0 0 20px rgba(255,215,0,0.8);
        }

        /* --- Masonry Grid (2 Columns) --- */
        .notes-grid {
            column-count: 2; 
            column-gap: 15px;
            width: 100%;
        }

        /* --- Individual Note Card (Heavy Glow) --- */
        .note-item { 
            background: #0a0a0a; 
            border: 2px solid #FFD700; /* Golden Border */
            padding: 15px; 
            margin-bottom: 15px; 
            border-radius: 15px; 
            break-inside: avoid; 
            display: inline-block; 
            width: 100%;
            cursor: pointer;
            position: relative;
            /* Heavy Golden Glow */
            box-shadow: 0 0 15px rgba(255,215,0,0.3), inset 0 0 10px rgba(255,215,0,0.1); 
            transition: 0.3s;
        }
        .note-item:hover {
            box-shadow: 0 0 25px rgba(255,215,0,0.6), inset 0 0 15px rgba(255,215,0,0.2);
            transform: translateY(-2px);
        }
        
        /* Subtle inner light at the top of card */
        .note-item::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, #FFD700, transparent);
        }

        .note-title { 
            color: #fff; 
            font-size: 14px; 
            font-weight: 500;
            margin-bottom: 10px; 
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 6; 
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .note-footer { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-top: 12px;
            border-top: 1px solid rgba(255,215,0,0.2);
            padding-top: 8px;
        }
        .note-date { 
            font-size: 10px; 
            color: #FFD700; 
            text-shadow: 0 0 5px rgba(255,215,0,0.5);
        }
        
        .delete-btn { 
            background: transparent; 
            color: #ff4444; 
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 5px;
            transition: 0.2s;
        }
        .delete-btn:hover {
            color: #fff;
            text-shadow: 0 0 10px #ff4444;
        }

        /* --- Floating Action Button (Add Note) --- */
        .fab {
            position: fixed;
            bottom: 90px;
            right: 25px;
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: black;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            box-shadow: 0 0 20px rgba(255,215,0,0.8), 0 0 40px rgba(255,215,0,0.4);
            cursor: pointer;
            z-index: 99;
            border: none;
            transition: 0.3s;
        }
        .fab:hover { transform: scale(1.1); }

        /* --- Bottom Navigation (Only 2 Buttons) --- */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 250px; /* Small width for 2 buttons */
            background: #0a0a0a;
            border: 2px solid #FFD700;
            border-radius: 50px;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            box-shadow: 0 0 20px rgba(255,215,0,0.4);
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            gap: 5px;
            transition: 0.3s;
        }
        .nav-icon-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #555;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #888;
            font-size: 18px;
            transition: 0.3s;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .nav-item span {
            font-size: 11px;
            color: #888;
            font-weight: 500;
        }
        
        /* Golden Active State */
        .nav-item.active .nav-icon-circle {
            border-color: #FFD700;
            color: #FFD700;
            box-shadow: 0 0 15px rgba(255,215,0,0.8), inset 0 0 10px rgba(255,215,0,0.3);
            text-shadow: 0 0 10px #FFD700;
        }
        .nav-item.active span {
            color: #FFD700;
            text-shadow: 0 0 5px rgba(255,215,0,0.5);
        }

        /* --- Modals --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-content {
            background: #0a0a0a;
            border: 2px solid #FFD700;
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(255,215,0,0.4);
            position: relative;
        }
        .modal-content h2 { color: #FFD700; margin-bottom: 20px; font-size: 20px; text-align: center; text-shadow: 0 0 10px #FFD700;}
        
        textarea { 
            width: 100%; 
            height: 150px; 
            background: #111; 
            color: #fff; 
            border: 1px solid #FFD700; 
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            resize: none;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        
        button.save-btn { 
            background: linear-gradient(90deg, #FFD700, #FFA500); 
            color: #000; 
            padding: 14px; 
            width: 100%; 
            border: none; 
            border-radius: 12px; 
            font-weight: bold; 
            font-size: 16px; 
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255,215,0,0.5);
        }

        .full-note-text {
            color: #eee;
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
            max-height: 60vh;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #ff4444;
            font-size: 20px;
            cursor: pointer;
            background: none;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="title-container">
            <i class="fas fa-crown"></i>
            <h1>ABD NOTES</h1>
        </div>
    </div>

    <!-- Top Buttons (All, Personal, Work, About) -->
    <div class="top-buttons">
        <div class="top-btn active">All</div>
        <div class="top-btn" onclick="showAbout()"><i class="fas fa-info"></i> About</div>
    </div>

    <!-- Masonry Grid Container -->
    <div class="notes-grid" id="notesList">
        <!-- Notes will be generated here -->
    </div>

    <!-- Floating Add Button -->
    <button class="fab" onclick="openAddModal()">
        <i class="fas fa-plus"></i>
    </button>

    <!-- Bottom Navigation (Only Notes and Profile) -->
    <div class="bottom-nav">
        <a href="#" class="nav-item active">
            <div class="nav-icon-circle"><i class="fas fa-sticky-note"></i></div>
            <span>Notes</span>
        </a>
        <a href="#" class="nav-item" onclick="showAbout(); return false;">
            <div class="nav-icon-circle"><i class="fas fa-user"></i></div>
            <span>Profile</span>
        </a>
    </div>

    <!-- ADD NOTE MODAL -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeAddModal()"><i class="fas fa-times"></i></button>
            <h2>New Note</h2>
            <textarea id="noteInput" placeholder="Write your note here..."></textarea>
            <button class="save-btn" onclick="saveNote()">SAVE NOTE</button>
        </div>
    </div>

    <!-- FULL NOTE VIEW MODAL -->
    <div class="modal" id="viewModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeViewModal()"><i class="fas fa-times"></i></button>
            <h2 id="viewTitle">Note Details</h2>
            <div class="full-note-text" id="viewText"></div>
            <span style="color:#FFD700; font-size:12px; text-shadow:0 0 5px #FFD700;" id="viewDate"></span>
        </div>
    </div>

    <!-- ABOUT MODAL -->
    <div class="modal" id="aboutModal">
        <div class="modal-content" style="text-align:center;">
            <i class="fas fa-crown" style="color: #FFD700; font-size: 50px; margin-bottom: 15px; text-shadow: 0 0 20px #FFD700;"></i>
            <h2>ABD NOTES</h2>
            <p style="color:#ccc; font-size:14px; margin-bottom:25px; line-height:1.6;">
                This premium app is proudly developed by <br>
                <strong style="color:#FFD700; font-size:16px; text-shadow:0 0 10px #FFD700;">ABD AI Studio</strong><br>
                Your trusted partner in digital innovation.
            </p>
            <button class="save-btn" onclick="closeAbout()">CLOSE</button>
        </div>
    </div>

    <script>
        let notes = JSON.parse(localStorage.getItem('abdNotes')) || [];
        
        // --- Add Note ---
        function openAddModal() {
            document.getElementById('addModal').style.display = 'flex';
        }
        function closeAddModal() {
            document.getElementById('addModal').style.display = 'none';
            document.getElementById('noteInput').value = '';
        }

        function saveNote() {
            let text = document.getElementById('noteInput').value;
            if(text.trim() === "") { alert("Note is empty!"); return; }
            
            let now = new Date();
            let dateStr = String(now.getDate()).padStart(2, '0') + '/' + String(now.getMonth() + 1).padStart(2, '0') + '/' + now.getFullYear();
            
            notes.unshift({ text: text, date: dateStr }); 
            localStorage.setItem('abdNotes', JSON.stringify(notes));
            closeAddModal();
            displayNotes();
        }

        // --- Delete Note ---
        function deleteNote(event, index) {
            event.stopPropagation(); 
            if(confirm("Delete this note?")) {
                notes.splice(index, 1);
                localStorage.setItem('abdNotes', JSON.stringify(notes));
                displayNotes();
            }
        }

        // --- View Full Note ---
        function openViewModal(index) {
            let note = notes[index];
            document.getElementById('viewText').innerText = note.text;
            document.getElementById('viewDate').innerText = "📅 " + note.date;
            document.getElementById('viewModal').style.display = 'flex';
        }
        function closeViewModal() {
            document.getElementById('viewModal').style.display = 'none';
        }

        // --- Display Notes ---
        function displayNotes() {
            let list = document.getElementById('notesList');
            list.innerHTML = "";
            
            if(notes.length === 0) { 
                list.innerHTML = "<p style='color:#888; text-align:center; width:100%; column-span: all; margin-top:20px;'>No notes yet. Tap + to add.</p>"; 
                return; 
            }
            
            notes.forEach((note, index) => {
                let div = document.createElement('div');
                div.className = 'note-item';
                div.setAttribute('onclick', `openViewModal(${index})`);
                
                let emojis = ['📝', '💡', '🔥', '😎', '💼', '📚', '🚀', '✨'];
                let randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];

                div.innerHTML = `
                    <div class="note-title">
                        ${randomEmoji} ${note.text}
                    </div>
                    <div class="note-footer">
                        <span class="note-date">📅 ${note.date}</span>
                        <button class="delete-btn" onclick="deleteNote(event, ${index})">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        // --- About Modal ---
        function showAbout() { document.getElementById('aboutModal').style.display = 'flex'; }
        function closeAbout() { document.getElementById('aboutModal').style.display = 'none'; }

        // Initialize
        displayNotes();
    </script>
</body>
    </html>
