<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABD NOTES</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@400;500;600&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #050505; 
            background-image: radial-gradient(#222 1px, transparent 1px);
            background-size: 20px 20px;
            color: #fff; 
            font-family: 'Poppins', sans-serif;
            padding: 15px;
            padding-bottom: 80px; /* For bottom bar */
        }

        /* --- Header Section --- */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .title-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .title-container i { color: #FFD700; font-size: 24px; text-shadow: 0 0 10px #FFD700; }
        .title-container h1 { 
            font-family: 'Cinzel', serif;
            color: #FFD700; 
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8); 
            font-size: 22px; 
        }
        .about-btn { 
            background: transparent; 
            color: #FFD700; 
            border: 2px solid #FFD700; 
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(255,215,0,0.5);
            cursor: pointer;
        }

        /* --- Categories / Tags (Dummy for design) --- */
        .tags-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .tag {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #ccc;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
        }
        .tag.active {
            background: #FFD700;
            color: black;
            border-color: #FFD700;
            font-weight: bold;
        }

        /* --- Masonry Grid (2 Columns) --- */
        .notes-grid {
            column-count: 2; /* Creates 2 columns */
            column-gap: 12px;
            width: 100%;
        }

        /* --- Individual Note Card --- */
        .note-item { 
            background: #111; 
            border: 1px solid #333;
            padding: 15px; 
            margin-bottom: 12px; 
            border-radius: 15px; 
            break-inside: avoid; /* Prevents card from breaking in middle */
            display: inline-block; /* Fix for masonry */
            width: 100%;
            cursor: pointer;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: 0.2s;
        }
        .note-item:hover {
            border-color: #FFD700;
            box-shadow: 0 0 15px rgba(255,215,0,0.3);
        }
        
        .note-title { 
            color: #eee; 
            font-size: 14px; 
            font-weight: 500;
            margin-bottom: 8px; 
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 5; /* Limits text to 5 lines */
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .note-footer { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-top: 10px;
        }
        .note-date { 
            font-size: 10px; 
            color: #888; 
        }
        
        .delete-btn { 
            background: transparent; 
            color: #ff4444; 
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 5px;
        }

        /* --- Floating Action Button (Add Note) --- */
        .fab {
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: black;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            box-shadow: 0 4px 15px rgba(255,215,0,0.5);
            cursor: pointer;
            z-index: 99;
            border: none;
        }

        /* --- Bottom Navigation --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #0a0a0a;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #555;
            text-decoration: none;
            font-size: 10px;
            gap: 5px;
        }
        .nav-item i { font-size: 22px; }
        .nav-item.active { color: #FFD700; text-shadow: 0 0 10px rgba(255,215,0,0.5); }

        /* --- Modals (Input, Full Note, About) --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-content {
            background: #111;
            border: 2px solid #FFD700;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(255,215,0,0.2);
            position: relative;
        }
        .modal-content h2 { color: #FFD700; margin-bottom: 15px; font-size: 18px; text-align: center;}
        
        textarea { 
            width: 100%; 
            height: 150px; 
            background: #1a1a1a; 
            color: #fff; 
            border: 1px solid #333; 
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            resize: none;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
        }
        
        button.save-btn { 
            background: #FFD700; 
            color: #000; 
            padding: 12px; 
            width: 100%; 
            border: none; 
            border-radius: 10px; 
            font-weight: bold; 
            font-size: 16px; 
            cursor: pointer;
        }

        .full-note-text {
            color: #ddd;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            max-height: 60vh;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #ff4444;
            font-size: 20px;
            cursor: pointer;
            background: none;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="title-container">
            <i class="fas fa-crown"></i>
            <h1>ABD NOTES</h1>
        </div>
        <button class="about-btn" onclick="showAbout()">
            <i class="fas fa-info"></i>
        </button>
    </div>

    <!-- Tags (Just for design) -->
    <div class="tags-container">
        <div class="tag active">All</div>
        <div class="tag">Personal</div>
        <div class="tag">Work</div>
        <div class="tag"><i class="fas fa-pen"></i></div>
    </div>

    <!-- Masonry Grid Container -->
    <div class="notes-grid" id="notesList">
        <!-- Notes will be generated here by JavaScript -->
    </div>

    <!-- Floating Add Button -->
    <button class="fab" onclick="openAddModal()">
        <i class="fas fa-plus"></i>
    </button>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a href="#" class="nav-item active">
            <i class="fas fa-sticky-note"></i>
            <span>Notes</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fas fa-calendar-alt"></i>
            <span>Calendar</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fas fa-search"></i>
            <span>Search</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fas fa-box"></i>
            <span>Templates</span>
        </a>
    </div>

    <!-- ADD NOTE MODAL -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeAddModal()"><i class="fas fa-times"></i></button>
            <h2>New Note</h2>
            <textarea id="noteInput" placeholder="Write your note here..."></textarea>
            <button class="save-btn" onclick="saveNote()">SAVE</button>
        </div>
    </div>

    <!-- FULL NOTE VIEW MODAL -->
    <div class="modal" id="viewModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeViewModal()"><i class="fas fa-times"></i></button>
            <h2 id="viewTitle">Note</h2>
            <div class="full-note-text" id="viewText"></div>
            <span style="color:#888; font-size:12px;" id="viewDate"></span>
        </div>
    </div>

    <!-- ABOUT MODAL -->
    <div class="modal" id="aboutModal">
        <div class="modal-content" style="text-align:center;">
            <i class="fas fa-crown" style="color: #FFD700; font-size: 40px; margin-bottom: 15px; text-shadow: 0 0 15px #FFD700;"></i>
            <h2>ABD NOTES</h2>
            <p style="color:#ccc; font-size:14px; margin-bottom:20px; line-height:1.6;">
                This premium app is proudly developed by <br>
                <strong style="color:#FFD700;">ABD AI Studio</strong><br>
                Your trusted partner.
            </p>
            <button class="save-btn" onclick="closeAbout()">CLOSE</button>
        </div>
    </div>

    <script>
        let notes = JSON.parse(localStorage.getItem('abdNotes')) || [];
        
        // --- Add Note ---
        function openAddModal() {
            document.getElementById('addModal').style.display = 'flex';
        }
        function closeAddModal() {
            document.getElementById('addModal').style.display = 'none';
            document.getElementById('noteInput').value = '';
        }

        function saveNote() {
            let text = document.getElementById('noteInput').value;
            if(text.trim() === "") { alert("Note is empty!"); return; }
            
            let now = new Date();
            let dateStr = String(now.getDate()).padStart(2, '0') + '/' + String(now.getMonth() + 1).padStart(2, '0') + '/' + now.getFullYear();
            
            notes.unshift({ text: text, date: dateStr }); 
            localStorage.setItem('abdNotes', JSON.stringify(notes));
            closeAddModal();
            displayNotes();
        }

        // --- Delete Note ---
        function deleteNote(event, index) {
            event.stopPropagation(); // Prevent opening the note
            if(confirm("Delete this note?")) {
                notes.splice(index, 1);
                localStorage.setItem('abdNotes', JSON.stringify(notes));
                displayNotes();
            }
        }

        // --- View Full Note ---
        function openViewModal(index) {
            let note = notes[index];
            document.getElementById('viewTitle').innerText = "Note Details";
            document.getElementById('viewText').innerText = note.text;
            document.getElementById('viewDate').innerText = "📅 " + note.date;
            document.getElementById('viewModal').style.display = 'flex';
        }
        function closeViewModal() {
            document.getElementById('viewModal').style.display = 'none';
        }

        // --- Display Notes in Masonry Grid ---
        function displayNotes() {
            let list = document.getElementById('notesList');
            list.innerHTML = "";
            
            if(notes.length === 0) { 
                list.innerHTML = "<p style='color:gray; text-align:center; width:100%; column-span: all;'>No notes yet. Tap + to add.</p>"; 
                return; 
            }
            
            notes.forEach((note, index) => {
                let div = document.createElement('div');
                div.className = 'note-item';
                div.setAttribute('onclick', `openViewModal(${index})`);
                
                // Generate a random emoji for the note
                let emojis = ['📝', '💡', '🔥', '😎', '💼', '📚', '🚀', '✨'];
                let randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];

                div.innerHTML = `
                    <div class="note-title">
                        ${randomEmoji} ${note.text}
                    </div>
                    <div class="note-footer">
                        <span class="note-date">${note.date}</span>
                        <button class="delete-btn" onclick="deleteNote(event, ${index})">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        // --- About Modal ---
        function showAbout() { document.getElementById('aboutModal').style.display = 'flex'; }
        function closeAbout() { document.getElementById('aboutModal').style.display = 'none'; }

        // Initialize
        displayNotes();
    </script>
</body>
    </html>
