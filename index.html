<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABD NOTES</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@400;500;600&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #000000; 
            color: #fff; 
            font-family: 'Poppins', sans-serif;
            padding: 15px;
            padding-bottom: 100px;
        }

        /* --- Top Header Box --- */
        .top-header-box {
            border: 3px solid #FFA500; 
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .top-header-box h1 {
            color: #fff;
            font-family: 'Cinzel', serif;
            font-size: 32px;
            letter-spacing: 2px;
        }

        /* --- Circle Buttons (4 Buttons) --- */
        .status-container {
            display: flex;
            justify-content: space-between; /* Space out 4 buttons */
            gap: 8px;
            margin-bottom: 25px;
            padding: 0 5px;
        }
        .status-circle {
            width: 75px; /* Adjusted size for 4 buttons */
            height: 75px;
            border-radius: 50%;
            border: 3px solid #FFA500;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 0 10px rgba(255, 165, 0, 0.5), inset 0 0 5px rgba(255, 165, 0, 0.3);
            transition: 0.3s;
            cursor: pointer;
            text-align: center;
        }
        .status-circle:hover {
            box-shadow: 0 0 20px rgba(255, 165, 0, 0.8);
            transform: scale(1.05);
        }

        /* --- Divider Line --- */
        .divider {
            border-top: 2px solid #FFA500;
            margin-bottom: 25px;
            box-shadow: 0 0 10px rgba(255,165,0,0.3);
        }

        /* --- Notes Grid (Bade Cards) --- */
        .notes-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .note-card {
            border: 3px solid #FFA500;
            border-radius: 10px;
            padding: 20px;
            background: #050505;
            box-shadow: 0 0 10px rgba(255,165,0,0.2);
            position: relative;
            cursor: pointer;
        }
        
        .note-card h3 {
            color: #fff;
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: 500;
        }
        
        .note-card p {
            color: #ccc;
            font-size: 14px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3; 
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .note-card .delete-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: #ff4444;
            font-size: 18px;
            cursor: pointer;
        }

        /* --- Bottom Buttons (Save & Plus) --- */
        .bottom-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            margin-bottom: 20px;
        }
        
        .save-notes-btn {
            background: transparent;
            border: 3px solid #FFA500;
            color: #fff;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            font-family: 'Cinzel', serif;
            letter-spacing: 1px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(255,165,0,0.4);
            cursor: pointer;
            flex-grow: 1;
            margin-right: 15px;
            text-transform: uppercase;
        }
        .save-notes-btn:hover {
            background: rgba(255, 165, 0, 0.1);
            box-shadow: 0 0 20px rgba(255,165,0,0.8);
        }

        .plus-btn {
            background: transparent;
            border: 3px solid #FFA500;
            color: #fff;
            width: 60px;
            height: 60px;
            font-size: 30px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(255,165,0,0.4);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .plus-btn:hover {
            background: rgba(255, 165, 0, 0.1);
            box-shadow: 0 0 20px rgba(255,165,0,0.8);
        }

        /* --- Modals --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-content {
            background: #000;
            border: 3px solid #FFA500;
            border-radius: 10px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(255,165,0,0.5);
            position: relative;
        }
        .modal-content h2 { color: #FFA500; margin-bottom: 20px; font-size: 22px; text-align: center; text-transform: uppercase;}
        
        textarea { 
            width: 100%; 
            height: 150px; 
            background: #000; 
            color: #fff; 
            border: 2px solid #FFA500; 
            padding: 15px; 
            border-radius: 5px; 
            margin-bottom: 20px; 
            resize: none;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
        }
        
        .modal-save-btn { 
            background: #FFA500; 
            color: #000; 
            padding: 15px; 
            width: 100%; 
            border: none; 
            border-radius: 5px; 
            font-weight: bold; 
            font-size: 16px; 
            cursor: pointer;
            text-transform: uppercase;
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #ff4444;
            font-size: 24px;
            cursor: pointer;
            background: none;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Top Header Box -->
    <div class="top-header-box">
        <h1>ABD NOTES</h1>
    </div>

    <!-- 4 Circle Buttons -->
    <div class="status-container">
        <div class="status-circle">Plans</div>
        <div class="status-circle">Dreams</div>
        <div class="status-circle">Work</div>
        <div class="status-circle" onclick="showAbout()">About</div>
    </div>

    <!-- Divider Line -->
    <div class="divider"></div>

    <!-- Notes Display -->
    <div class="notes-grid" id="notesList">
        <!-- Notes will be generated here -->
    </div>

    <!-- Bottom Action Buttons -->
    <div class="bottom-action-bar">
        <button class="save-notes-btn" onclick="openAddModal()">SAVE NOTES</button>
        <button class="plus-btn" onclick="openAddModal()">+</button>
    </div>

    <!-- ADD NOTE MODAL -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeAddModal()">×</button>
            <h2>New Note</h2>
            <textarea id="noteInput" placeholder="Write your note here..."></textarea>
            <button class="modal-save-btn" onclick="saveNote()">SAVE</button>
        </div>
    </div>

    <!-- FULL NOTE VIEW MODAL -->
    <div class="modal" id="viewModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeViewModal()">×</button>
            <h2>Note Details</h2>
            <div id="viewText" style="color:#fff; font-size:16px; line-height:1.6; white-space:pre-wrap; max-height:60vh; overflow-y:auto;"></div>
        </div>
    </div>

    <script>
        let notes = JSON.parse(localStorage.getItem('abdNotes')) || [];
        
        // --- Add Note ---
        function openAddModal() {
            document.getElementById('addModal').style.display = 'flex';
        }
        function closeAddModal() {
            document.getElementById('addModal').style.display = 'none';
            document.getElementById('noteInput').value = '';
        }

        function saveNote() {
            let text = document.getElementById('noteInput').value;
            if(text.trim() === "") { alert("Note is empty!"); return; }
            
            notes.unshift({ text: text }); 
            localStorage.setItem('abdNotes', JSON.stringify(notes));
            closeAddModal();
            displayNotes();
        }

        // --- Delete Note ---
        function deleteNote(event, index) {
            event.stopPropagation(); 
            if(confirm("Delete this note?")) {
                notes.splice(index, 1);
                localStorage.setItem('abdNotes', JSON.stringify(notes));
                displayNotes();
            }
        }

        // --- View Full Note ---
        function openViewModal(index) {
            document.getElementById('viewText').innerText = notes[index].text;
            document.getElementById('viewModal').style.display = 'flex';
        }
        function closeViewModal() {
            document.getElementById('viewModal').style.display = 'none';
        }

        // --- Display Notes ---
        function displayNotes() {
            let list = document.getElementById('notesList');
            list.innerHTML = "";
            
            if(notes.length === 0) { 
                list.innerHTML = "<p style='color:#888; text-align:center;'>No notes yet. Tap + to add.</p>"; 
                return; 
            }
            
            notes.forEach((note, index) => {
                let div = document.createElement('div');
                div.className = 'note-card';
                div.setAttribute('onclick', `openViewModal(${index})`);
                
                div.innerHTML = `
                    <h3>Note ${notes.length - index}</h3>
                    <p>${note.text}</p>
                    <button class="delete-btn" onclick="deleteNote(event, ${index})">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                `;
                list.appendChild(div);
            });
        }

        // --- About Dialog ---
        function showAbout() {
            let dialog = document.createElement('div');
            dialog.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); display:flex; justify-content:center; align-items:center; z-index:1000; padding:20px;';
            dialog.innerHTML = `
                <div style="background:#000; border:3px solid #FFA500; border-radius:10px; padding:30px 20px; text-align:center; box-shadow:0 0 30px rgba(255,165,0,0.5); max-width:400px; width:100%; color:#fff;">
                    <h2 style="color:#FFA500; margin-bottom:15px; font-family:'Cinzel', serif;">ABD NOTES</h2>
                    <p style="color:#ccc; font-size:14px; line-height:1.6; margin-bottom:20px;">
                        This premium app is proudly developed by <br>
                        <strong style="color:#FFA500; font-size:16px;">ABD AI Studio</strong><br>
                        Your trusted partner.
                    </p>
                    <button onclick="this.parentElement.parentElement.remove()" style="background:#FFA500; color:#000; border:none; padding:12px 25px; border-radius:5px; font-weight:bold; cursor:pointer; font-size:16px;">CLOSE</button>
                </div>
            `;
            document.body.appendChild(dialog);
        }

        // Initialize
        displayNotes();
    </script>
</body>
            </html>
